name: Windows Rust build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Typecheck and bundle frontend
        shell: pwsh
        run: npm run build

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        continue-on-error: false

      - name: Package Windows EXE installer
        shell: pwsh
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows EXE and installer
        uses: actions/upload-artifact@v4
        with:
          name: VPrint-Rust-Windows
          path: |
            app/src-tauri/target/release/vprint.exe
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
