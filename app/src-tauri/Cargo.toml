[package]
name = "vprint"
version = "0.2.0"
description = "VPrint — Windows virtual printer manager"
authors = ["VPrint contributors"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "vprint_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(windows)'.dependencies]
# Win32 printing and Event Log APIs are called through narrow, documented FFI boundaries.

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
